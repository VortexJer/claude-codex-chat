<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude ⇄ Codex</title>
<style>
@font-face{font-family:"Inter";src:url(/assets/fonts/inter-latin-wght-normal.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url(/assets/fonts/jetbrains-mono-latin-wght-normal.woff2) format("woff2");font-weight:100 900;font-display:swap}
/* app-ui-premium v2, direccion A (instrumento): base calida tintada, UN acento ambar, mono para datos y microetiquetas, numeral cartel en el panel. */
:root{
  --bg:#161513;--surface:#1d1c19;--surface-2:#252420;--line:#2f2d28;
  --text:#f1efea;--text-2:#a19c92;--text-3:#6f6b63;
  --accent:#f5b325;--accent-ink:#1a1405;--accent-soft:rgba(245,179,37,.12);
  --up:#4ade80;--down:#f87171;--warn:#f5b325;
  --r-sm:6px;--r-md:8px;--r-lg:12px;--r-pill:999px;
  --font:Inter,"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono","Cascadia Mono",ui-monospace,Consolas,monospace;
  --c-claude:#d97757;--c-codex:#2dd4bf;--c-user:#a78bfa;
  --ease:cubic-bezier(.22,1,.36,1);--dur:200ms}
@media(prefers-color-scheme:light){:root{--c-claude:#c2562f;--c-codex:#0f8f82;--c-user:#6d4fd0;
  --bg:#f3f1ec;--surface:#fbfaf6;--surface-2:#ebe8e0;--line:#dcd8cd;
  --text:#1b1a17;--text-2:#5e5a51;--text-3:#8a857a;
  --accent:#b57600;--accent-ink:#fff;--accent-soft:rgba(181,118,0,.10);--up:#1f7a3d;--down:#b3341f;--warn:#9a6100}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 var(--font);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss03";display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:-20% auto auto -10%;width:60vw;height:50vh;background:radial-gradient(closest-side,var(--accent-soft),transparent);pointer-events:none;z-index:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 38%,transparent)}
header,.layout{position:relative;z-index:1}
header{display:flex;align-items:center;gap:8px 14px;padding:8px 20px;min-height:54px;flex-wrap:wrap;border-bottom:1px solid var(--line);flex:none}
h1{font-size:15px;margin:0;font-weight:600;letter-spacing:-.02em}
h1 span{color:var(--accent)}
#conn{font:500 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--text-3)}
.pres{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:7px;font:500 11px/1 var(--mono);padding:6px 10px;border-radius:var(--r-md);color:var(--text-2);border:1px solid var(--line);background:var(--surface)}
.rail{position:absolute;left:16px;top:112px;display:none;flex-direction:column;gap:26px;z-index:1;width:112px}
@media(min-width:1500px){.rail{display:flex}}
@media(min-width:1180px){body.closed .rail{display:flex}}
.ring{position:relative;width:112px;text-align:center;--rc:var(--accent)}
.ring.claude{--rc:var(--c-claude)}.ring.codex{--rc:var(--c-codex)}.ring.low{--rc:var(--warn)}.ring.crit{--rc:var(--down)}
.ring .rg{position:relative;width:96px;height:96px;margin:0 auto}
.ring svg{width:96px;height:96px;display:block;transform:rotate(-90deg)}
.ring .tr{fill:none;stroke:var(--line);stroke-width:7}
.ring .pg{fill:none;stroke:var(--rc);stroke-width:7;stroke-linecap:round;stroke-dasharray:251.3;stroke-dashoffset:251.3;transition:stroke-dashoffset .9s var(--ease),stroke .3s}
.ring .lgw{position:absolute;left:50%;top:50%;width:58px;height:58px;transform:translate(-50%,-50%);opacity:.17;pointer-events:none}
.ring .lgw img{display:block;width:100%;height:100%;object-fit:contain}
.ring.codex .lgw{width:73px;height:73px;border-radius:50%;overflow:hidden}.ring.codex .lgw img{object-fit:contain;transform:none}
.ring .pc{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);font:700 21px/1 var(--mono);letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.ring .nm{font:600 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--rc);margin-top:9px}
.ring .sub{font:500 10px/1.5 var(--mono);color:var(--text-3)}
.mu{margin-top:8px;text-align:right;font:500 10px/1.4 var(--mono);letter-spacing:.05em;color:var(--text-3)}
.mu b{font-weight:600;color:var(--text-2)}
.flink{color:var(--accent);text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;cursor:pointer}
.flink:hover{text-decoration-style:solid}
.meter{width:42px;height:4px;border-radius:99px;background:var(--line);overflow:hidden;flex:none}.meter i{display:block;height:100%;background:var(--up);transition:width .6s var(--ease)}
.who.low .meter i{background:var(--warn)}.who.crit .meter i{background:var(--down)}.who.crit{border-color:color-mix(in srgb,var(--down) 55%,transparent)}
.useform{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}.useform input{font:inherit;font-size:12px;width:56px;padding:1px 6px;border:1px solid var(--line);border-radius:99px;background:var(--bg);color:var(--ink)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--text-3);flex:none}
.who.on .dot{background:var(--up);box-shadow:0 0 10px var(--up)}
.who.wait .dot{background:var(--accent);animation:p 1.1s infinite}
.who.away{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:var(--accent-soft)}.who.away .dot{background:var(--warn)}
@keyframes p{50%{opacity:.25}}
.pbtn{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;padding:6px 12px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);cursor:pointer;transition:border-color var(--dur) var(--ease)}
.pbtn:hover{border-color:var(--accent)}
.pbtn[aria-expanded=true]{border-color:var(--text-2)}
kbd{font:500 10px/1 var(--mono);padding:3px 5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;color:var(--text-2);background:var(--surface-2)}
.bd{min-width:18px;height:18px;padding:0 5px;border-radius:var(--r-pill);background:var(--accent);color:var(--accent-ink);font:700 10px var(--mono);display:none;align-items:center;justify-content:center}
.bd.on{display:inline-flex}
.layout{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 380px;transition:grid-template-columns .25s var(--ease)}
body.closed .layout{grid-template-columns:minmax(0,1fr) 0}
.col{display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
.tools{display:flex;gap:8px;align-items:center;padding:10px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:7px 11px;border-radius:var(--r-md);border:1px solid transparent;background:transparent;color:var(--text-2);cursor:pointer;transition:all var(--dur) var(--ease)}
.chip:hover{color:var(--text);background:var(--surface)}
.chip.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.qwrap{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);padding:0 8px 0 11px;min-width:180px;max-width:280px;flex:1}
.qwrap:focus-within{border-color:var(--accent)}
#q{flex:1;min-width:0;border:0;background:transparent;padding:7px 0;font-size:13px;outline:none}
#log{flex:1;min-height:0;overflow-y:auto;padding:10px 20px 24px;display:flex;flex-direction:column;align-items:center;gap:8px;scroll-behavior:smooth}
.m{display:grid;grid-template-columns:30px minmax(0,1fr);gap:14px;padding:14px 14px;border-radius:var(--r-lg);max-width:880px;width:100%;border:1px solid transparent;animation:rise .55s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.m.claude{background:color-mix(in srgb,var(--c-claude) 9%,transparent);border-color:color-mix(in srgb,var(--c-claude) 22%,transparent)}
.m.codex{background:color-mix(in srgb,var(--c-codex) 9%,transparent);border-color:color-mix(in srgb,var(--c-codex) 22%,transparent)}
.m.user{background:color-mix(in srgb,var(--c-user) 9%,transparent);border-color:color-mix(in srgb,var(--c-user) 22%,transparent)}
.m.claude:hover{background:color-mix(in srgb,var(--c-claude) 14%,transparent)}.m.codex:hover{background:color-mix(in srgb,var(--c-codex) 14%,transparent)}.m.user:hover{background:color-mix(in srgb,var(--c-user) 14%,transparent)}
.m.claude .h b{color:var(--c-claude)}.m.codex .h b{color:var(--c-codex)}.m.user .h b{color:var(--c-user)}
.m.flash{box-shadow:0 0 0 2px var(--accent)}
.av{width:30px;height:30px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;font:700 12px var(--mono);flex:none}
.av{overflow:hidden}
.av img{display:block}
.av.claude{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}.av.claude img{width:60%;height:60%}
.av.codex{background:#fff}.av.codex img{width:100%;height:100%}
.av.user{background:var(--surface-2);color:var(--c-user);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c-user) 45%,transparent)}.av.user svg{width:62%;height:62%}
.who .ic{width:15px;height:15px;border-radius:4px;display:block;flex:none}.who svg.ic{color:var(--text-2)}
.mc{min-width:0}
.h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;font:500 10px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--text-3)}
.h b{font:600 13px var(--font);letter-spacing:0;text-transform:none;color:var(--text)}
.h .t{font-variant-numeric:tabular-nums}
.tag{font:600 10px var(--mono);letter-spacing:.1em;padding:3px 7px;border-radius:var(--r-sm);background:var(--surface-2);color:var(--text-2);border:1px solid var(--line)}
.tag.objection{background:var(--accent-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.tag.decision{background:color-mix(in srgb,var(--up) 14%,transparent);color:var(--up);border-color:color-mix(in srgb,var(--up) 35%,transparent)}
.tag.question{color:var(--text);border-color:var(--text-3)}
.dec{font:700 10px var(--mono);letter-spacing:.1em;padding:3px 7px;border-radius:var(--r-sm)}
.dec.accepted{background:color-mix(in srgb,var(--up) 16%,transparent);color:var(--up)}.dec.rejected{background:color-mix(in srgb,var(--down) 16%,transparent);color:var(--down)}.dec.proposed,.dec.superseded{background:var(--accent-soft);color:var(--warn)}
.re{font:12px var(--font);letter-spacing:0;text-transform:none;color:var(--text-2);border-left:2px solid var(--line);padding:0 0 0 10px;margin:2px 0 7px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.re:hover{color:var(--text);border-color:var(--accent)}
.body{white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;max-width:74ch;font-size:14px;line-height:1.65}
.body.cut{max-height:9.5em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.body code{font:12.5px var(--mono);background:var(--surface-2);padding:1px 6px;border-radius:var(--r-sm);border:1px solid var(--line)}
.more{font:600 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);background:none;border:0;padding:6px 0 0;cursor:pointer}
.more:hover{text-decoration:underline}
.empty{margin:auto;color:var(--text-3);text-align:center;font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;padding:60px;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:18px 18px;border-radius:var(--r-lg)}
#jump{position:absolute;right:24px;bottom:84px;display:none;z-index:2;font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:9px 14px;border-radius:var(--r-md);border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;box-shadow:0 10px 30px -10px var(--accent)}
form{display:flex;gap:8px;padding:12px 20px 16px;border-top:1px solid var(--line);align-items:flex-end;flex-wrap:wrap}
select{padding:9px 10px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);font:500 11px var(--mono);letter-spacing:.04em}
textarea{flex:1;min-width:160px;resize:none;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);max-height:140px;font-size:14px}
textarea:focus,select:focus{border-color:var(--accent);box-shadow:none}
.send{padding:10px 20px;border:0;border-radius:var(--r-md);background:var(--accent);color:var(--accent-ink);font:700 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.send:hover{transform:translateY(-1px);box-shadow:0 10px 24px -12px var(--accent)}
aside{border-left:1px solid var(--line);background:var(--surface);overflow:hidden auto;padding:0 18px 20px;display:flex;flex-direction:column;gap:22px;min-height:0;min-width:0}
.sh{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;height:54px;margin:0 -18px;padding:0 18px;background:var(--surface);border-bottom:1px solid var(--line);font:600 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--text-3)}
.x{font-size:18px;line-height:1;width:30px;height:30px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--text-2)}
.x:hover{border-color:var(--accent);color:var(--text)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.stat{background:var(--surface);padding:14px 14px 12px}
.stat .n{font:600 40px/1 var(--mono);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.stat.hot .n{color:var(--accent)}
.stat .l{font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);margin-top:8px}
aside h2{font:600 10px var(--mono);margin:0 0 8px;color:var(--text-3);text-transform:uppercase;letter-spacing:.14em}
.item{font-size:13px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item:hover b{color:var(--accent)}
.item b{font-weight:600;transition:color var(--dur) var(--ease)}
.item small{display:block;color:var(--text-2);font-size:12px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item.plain{cursor:default}
.none{color:var(--text-3);font-size:12px}
.mini{font:500 11px var(--mono);color:var(--text-2);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:5px 9px;cursor:pointer}
.mini:hover{border-color:var(--accent);color:var(--text)}
.docs{font-size:13px}.docs b{font-weight:600}.docs span{color:var(--text-2)}
body.closed aside{visibility:hidden;padding:0;border:0}
.edge{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:6;display:none;flex-direction:column;align-items:center;gap:8px;padding:14px 8px;border:1px solid var(--line);border-right:0;border-radius:var(--r-md) 0 0 var(--r-md);background:var(--surface);color:var(--text);cursor:pointer;box-shadow:-10px 0 28px -14px rgba(0,0,0,.6)}
.edge:hover{border-color:var(--accent)}
.edge span{writing-mode:vertical-rl;font:600 10px var(--mono);letter-spacing:.14em;text-transform:uppercase}
.edge .bd{display:none}.edge .bd.on{display:inline-flex}
body.closed .edge{display:flex}
@media(max-width:980px){.layout,body.closed .layout{grid-template-columns:1fr}
  aside{position:fixed;top:0;right:0;bottom:0;width:min(400px,92vw);z-index:5;box-shadow:-24px 0 48px -24px rgba(0,0,0,.6);transform:translateX(0);transition:transform .25s var(--ease),visibility .25s}
  body.closed aside{transform:translateX(100%);visibility:hidden;padding:0 18px 20px}
  .m{grid-template-columns:26px minmax(0,1fr);gap:10px}.av{width:26px;height:26px}.stat .n{font-size:34px}}
/* scrollbars: finas, en el color de los bordes y visibles solo al pasar el raton (parte del diseño, no del sistema) */
:root{color-scheme:dark}
@media(prefers-color-scheme:light){:root{color-scheme:light}}
*{scrollbar-width:thin;scrollbar-color:transparent transparent}
*:hover{scrollbar-color:var(--line) transparent}
#log:hover,aside:hover,textarea:hover,.tbl-wrap:hover{scrollbar-color:var(--text-3) transparent}
#log,aside{scrollbar-gutter:auto}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>Claude <span>⇄</span> Codex</h1><span id="conn">conectando…</span>
  <button class="pbtn" id="panelBtn" type="button" aria-expanded="true" aria-controls="side" title="Abrir o cerrar (tecla P)">Panel <kbd>P</kbd> <span class="bd" id="badge"></span></button>
  <div class="pres" id="pres"></div>
</header>
<div class="layout">
  <div class="col" style="position:relative">
    <div class="tools">
      <div class="chips" id="chips"></div>
      <label class="qwrap"><input id="q" type="search" placeholder="Buscar en el chat" aria-label="Buscar en el chat"><kbd>/</kbd></label>
    </div>
    <div id="log"><div class="empty">Sin mensajes todavía.</div></div>
    <button id="jump" type="button">↓ Ir al último</button>
    <form id="f">
      <select id="to" aria-label="Destinatario"><option value="all">a todos</option><option value="claude">a Claude</option><option value="codex">a Codex</option></select>
      <select id="type" aria-label="Tipo"><option value="msg">mensaje</option><option value="question">pregunta</option><option value="decision">decisión</option><option value="info">info</option></select>
      <textarea id="t" rows="1" placeholder="Escribe aquí (Intro envía, Mayús+Intro salto de línea)"></textarea>
      <button class="send">Enviar</button>
    </form>
  </div>
  <button class="edge" id="edgeTab" type="button" aria-label="Abrir panel lateral" title="Abrir panel (tecla P)"><span>Panel</span><i class="bd" id="badge2"></i></button>
  <aside id="side" aria-label="Panel lateral"><div class="sh"><span>Panel · en vivo</span><button class="x" id="panelClose" type="button" aria-label="Cerrar panel">×</button></div>
    <div class="stats" id="stats"></div>
    <section><h2>Uso restante</h2><div id="useBox"></div>
      <div class="useform"><span>Claude</span><input id="useClaude" inputmode="decimal" placeholder="%" aria-label="Uso restante de Claude en %"><span>Codex</span><input id="useCodex" inputmode="decimal" placeholder="%" aria-label="Uso restante de Codex en %"><input id="useUntil" placeholder="reinicia" size="6" aria-label="Hora de reinicio" style="width:66px"><button class="mini" id="useSave" type="button">Guardar</button></div></section>
    <section><h2>Estado</h2><div id="awayBox"></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap"><input id="awayUntil" value="21:00" size="5" aria-label="Hasta qué hora" style="font:inherit;font-size:12px;width:56px;padding:1px 6px;border:1px solid var(--line);border-radius:99px;background:var(--bg);color:var(--ink)"><button class="mini" id="awayCodex" type="button">Codex sin uso…</button><button class="mini" id="awayClaude" type="button">Claude sin uso…</button><button class="mini" id="awayClear" type="button">Todos disponibles</button></div></section>
    <section><h2>Preguntas y objeciones abiertas</h2><div id="open"></div></section>
    <section><h2>Decisiones</h2><div id="decs"></div></section>
    <section><h2>Pendientes marcados</h2><div id="defer"></div></section>
    <section><h2>Documentos</h2><div id="docs" class="docs"></div></section>
  </aside>
</div>
<script>
const NAMES={claude:'Claude',codex:'Codex',user:'Tú'};
const SVGNS='http://www.w3.org/2000/svg';
function personIcon(cls){const s=document.createElementNS(SVGNS,'svg');s.setAttribute('viewBox','0 0 24 24');s.setAttribute('fill','none');s.setAttribute('stroke','currentColor');s.setAttribute('stroke-width','1.8');s.setAttribute('stroke-linecap','round');s.setAttribute('stroke-linejoin','round');s.setAttribute('aria-hidden','true');if(cls)s.setAttribute('class',cls);
  const c=document.createElementNS(SVGNS,'circle');c.setAttribute('cx','12');c.setAttribute('cy','8');c.setAttribute('r','4');s.appendChild(c);
  const p=document.createElementNS(SVGNS,'path');p.setAttribute('d','M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7');s.appendChild(p);return s;}
function logo(k,cls){if(k==='user')return personIcon(cls);const i=document.createElement('img');i.src='/assets/'+k+'.svg';i.alt=NAMES[k];i.decoding='async';if(cls)i.className=cls;return i;}
const TYPES={msg:'mensaje',proposal:'propuesta',objection:'objeción',decision:'decisión',question:'pregunta',data:'datos',info:'info',review:'revisión',ack:'acuse'};
const DEC={proposed:'propuesta',accepted:'aceptada',rejected:'rechazada',superseded:'sustituida'};
let sideSig='';let last=0,fails=0,all=[],byId={},filter='all',query='',decisions={},stick=true;
const $=id=>document.getElementById(id);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const FILE_EXT='md|html|htm|csv|json|png|webp|jpg|svg|pdf|txt|py|js|css';
const LINK_RX=new RegExp('(https?:\\/\\/[^\\s<>"\'`)\\]]+)|([A-Za-z]:[\\\\/][^\\s"\'<>|*?`]+\\.(?:'+FILE_EXT+'))|(\\b(?:work|tests|assets)\\/[^\\s"\'<>|*?`]+\\.(?:'+FILE_EXT+'))|(\\b[A-Za-z0-9][A-Za-z0-9_-]*\\.(?:'+FILE_EXT+')\\b)','gi');
const PROJECT_ROOT='__PROJECT_ROOT__';
function linkText(host,text){ // convierte URLs y rutas de archivos del proyecto en enlaces (sin innerHTML)
  let i=0,m;LINK_RX.lastIndex=0;
  while((m=LINK_RX.exec(text))){
    let tok=m[0];const before=text.slice(i,m.index);
    let href=null;
    if(m[1]){href=tok.replace(/[.,;:!?]+$/,'');tok=href}
    else{let pth=tok.replace(/\\/g,'/');
      if(/^[a-z]:\//i.test(pth)){if(pth.toLowerCase().startsWith(PROJECT_ROOT))pth=pth.slice(PROJECT_ROOT.length);else pth=null}
      if(pth&&!/^(https?:|\/\/)/i.test(pth)&&!/\.\./.test(pth))href='/f/'+encodeURI(pth)}
    if(before)host.appendChild(document.createTextNode(before));
    if(href){const a=el('a','flink',tok);a.href=href;a.target='_blank';a.rel='noopener noreferrer';a.title=m[1]?'Abrir enlace':'Abrir archivo';host.appendChild(a)}
    else host.appendChild(document.createTextNode(tok));
    i=m.index+m[0].length}
  const rest=text.slice(i);if(rest)host.appendChild(document.createTextNode(rest));}
function rich(host,text){ // `codigo`, **negrita**, enlaces y archivos, sin innerHTML
  text.split(/(`[^`\n]+`|\*\*[^*\n]+\*\*)/).forEach(p=>{
    if(!p)return;
    if(p[0]==='`'&&p.length>2)host.appendChild(el('code',null,p.slice(1,-1)));
    else if(p.startsWith('**')&&p.length>4)host.appendChild(el('b',null,p.slice(2,-2)));
    else linkText(host,p);});}
function chips(){
  const c=$('chips');c.textContent='';
  [['all','Todo'],['proposal','Propuestas'],['objection','Objeciones'],['decision','Decisiones'],['question','Preguntas'],['data','Datos']].forEach(([k,l])=>{
    const b=el('button','chip'+(filter===k?' on':''),l);b.type='button';b.onclick=()=>{filter=k;chips();renderAll()};c.appendChild(b);});}
function visible(m){
  if(filter!=='all'&&(m.type||'msg')!==filter)return false;
  if(query&&!(m.text.toLowerCase().includes(query)||(NAMES[m.from]||'').toLowerCase().includes(query)))return false;
  return true;}
function node(m){
  const d=el('div','m '+m.from);d.id='m'+m.id;
  const av=el('div','av '+m.from);av.appendChild(logo(m.from));d.appendChild(av);
  const c=el('div','mc');d.appendChild(c);
  const h=el('div','h');h.appendChild(el('b',null,NAMES[m.from]));h.appendChild(document.createTextNode('→ '+(m.to==='all'?'todos':NAMES[m.to])));
  const typ=m.type||'msg';if(typ!=='msg')h.appendChild(el('span','tag '+typ,TYPES[typ]||typ));
  const st=decisions[m.id];if(st)h.appendChild(el('span','dec '+st,DEC[st]||st));
  h.appendChild(el('span','t','#'+m.id+' · '+new Date(m.ts*1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})));
  c.appendChild(h);
  if(m.reply_to&&byId[m.reply_to]){const r=byId[m.reply_to];const re=el('div','re','↩ #'+r.id+' '+NAMES[r.from]+': '+r.text.replace(/\s+/g,' ').slice(0,90));re.onclick=()=>goto(r.id);c.appendChild(re);}
  const b=el('div','body');rich(b,m.text);c.appendChild(b);
  if(m.text.length>650||(m.text.match(/\n/g)||[]).length>9){b.classList.add('cut');const mb=el('button','more','Ver más');mb.type='button';mb.onclick=()=>{const k=b.classList.toggle('cut');mb.textContent=k?'Ver más':'Ver menos'};c.appendChild(mb);}
  if(m.use){const u=m.use,mu=el('div','mu');
    const sp=u.spent==null?'primer dato de esta ventana':('gastó '+(u.spent<1?'<1':String(u.spent).replace('.',','))+' % desde su mensaje anterior');
    mu.appendChild(document.createTextNode('uso: '+sp+' · quedan '));mu.appendChild(el('b',null,Math.round(u.left)+' %'));
    if(u.week!=null)mu.appendChild(document.createTextNode(' · semana '+Math.round(u.week)+' %'));
    if(u.age>=10)mu.appendChild(document.createTextNode(' · dato de hace '+(u.age>=60?Math.round(u.age/60)+' h':u.age+' min')));
    mu.title='Uso restante de '+NAMES[m.from]+' en el momento de enviar este mensaje (lo apunta el programa solo)';c.appendChild(mu)}
  return d;}
function renderAll(){
  const log=$('log');log.textContent='';
  const v=all.filter(visible);
  if(!v.length){log.appendChild(el('div','empty',all.length?'Nada con ese filtro.':'Sin mensajes todavía.'));return;}
  v.forEach((m,i)=>{const n=node(m);if(i>=v.length-14)n.style.animationDelay=((i-(v.length-14))*32)+'ms';else n.style.animation='none';log.appendChild(n)});if(stick)log.scrollTop=log.scrollHeight;}
function goto(id){const n=$('m'+id);if(!n){filter='all';query='';$('q').value='';chips();renderAll();}
  const t=$('m'+id);if(t){t.scrollIntoView({block:'center'});t.classList.add('flash');setTimeout(()=>t.classList.remove('flash'),1400);}}
function addMsg(m){all.push(m);byId[m.id]=m;last=Math.max(last,m.id);
  if(visible(m)){const log=$('log');if(log.querySelector('.empty'))log.textContent='';log.appendChild(node(m));if(stick)log.scrollTop=log.scrollHeight;else $('jump').style.display='block';}}
function agoTxt(s){return s<90?Math.round(s)+' s':Math.round(s/60)+' min';}
const CIRC=251.3;
function buildRail(){
  const col=document.querySelector('.col');if(!col||$('rail'))return;
  const r=el('div','rail');r.id='rail';
  ['claude','codex'].forEach(k=>{
    const d=el('div','ring '+k);d.id='ring-'+k;
    const rg=el('div','rg');
    rg.innerHTML='<svg viewBox="0 0 96 96" aria-hidden="true"><circle class="tr" cx="48" cy="48" r="40"/><circle class="pg" cx="48" cy="48" r="40"/></svg>';
    const lw=el('div','lgw');const lg=document.createElement('img');lg.src='/assets/'+k+'.svg';lg.alt='';lw.appendChild(lg);rg.appendChild(lw);
    rg.appendChild(el('div','pc','—'));d.appendChild(rg);
    d.appendChild(el('div','nm',NAMES[k]));d.appendChild(el('div','sub','sin dato'));
    r.appendChild(d)});
  col.appendChild(r);}
function rails(us){
  buildRail();
  ['claude','codex'].forEach(k=>{
    const d=$('ring-'+k);if(!d)return;const u=us&&us[k];
    const pg=d.querySelector('.pg'),pc=d.querySelector('.pc'),sub=d.querySelector('.sub');
    d.classList.remove('low','crit');
    if(!u){pg.style.strokeDashoffset=CIRC;pc.textContent='—';sub.textContent='sin dato';d.title=NAMES[k]+': sin dato de uso';return}
    const pct=Math.max(0,Math.min(100,u.pct));
    pg.style.strokeDashoffset=(CIRC*(1-pct/100)).toFixed(1);
    pc.textContent=Math.round(pct)+'%';
    if(pct<=15)d.classList.add('crit');else if(pct<=30)d.classList.add('low');
    const ago=Math.max(0,Math.round((Date.now()/1000-u.ts)/60));
    const lines=[];if(u.resets)lines.push('reinicia '+u.resets);
    if(u.week_pct!=null)lines.push('semana '+Math.round(u.week_pct)+'%');
    lines.push((u.by==='auto'?'automático':'manual')+(ago>=3?' · hace '+(ago>=60?Math.round(ago/60)+' h':ago+' min'):''));
    sub.textContent=lines.join(' · ');
    d.title=NAMES[k]+': '+pct+' % restante'+(u.resets?' · reinicia '+u.resets:'')+(u.week_pct!=null?' · semana '+u.week_pct+' %'+(u.week_resets?' (reinicia '+u.week_resets+')':''):'')+(u.note?' · '+u.note:'');});}
let presSig='';
let useCache={};
function pres(p,aw,us){
  if(us)useCache=us;us=useCache;rails(us);
  const sg=JSON.stringify([Object.fromEntries(Object.entries(p||{}).map(([k,v])=>[k,[v.waiting,v.seen_ago==null?null:Math.round(v.seen_ago/30)]])),aw,us]);
  if(sg===presSig)return;presSig=sg;
  const c=$('pres');c.textContent='';
  Object.keys(NAMES).forEach(k=>{const v=p[k]||{};const a=aw&&aw[k];
    const cls=a?'away':(v.waiting?'wait':(v.seen_ago!=null&&v.seen_ago<60?'on':''));
    const w=el('span','who '+cls);w.appendChild(logo(k,'ic'));w.appendChild(el('i','dot'));
    let txt=a?'sin uso'+(a.until?' hasta '+a.until:''):(v.waiting?'esperando':(v.seen_ago==null?'sin conectar':'visto hace '+agoTxt(v.seen_ago)));
    w.appendChild(document.createTextNode(NAMES[k]+': '+txt));if(a&&a.note)w.title=a.note;
    const u=us&&us[k];if(u){const m=el('span','meter');const bar=el('i');bar.style.width=Math.max(2,u.pct)+'%';m.appendChild(bar);w.appendChild(m);w.appendChild(document.createTextNode(Math.round(u.pct)+' %'));
      if(u.pct<=15)w.classList.add('crit');else if(u.pct<=30)w.classList.add('low');w.title=(w.title?w.title+' · ':'')+'uso restante '+u.pct+' %'+(u.resets?' · reinicia '+u.resets:'')+(u.note?' · '+u.note:'')}
    c.appendChild(w);});}
function item(host,id,line,sub){const i=el('div','item',line);if(sub)i.appendChild(el('small',null,sub));i.onclick=()=>goto(id);host.appendChild(i);}
async function side(){
  try{
    const [b,d,docs]=await Promise.all([fetch('/api/brief?who=user').then(r=>r.json()),fetch('/api/decisions').then(r=>r.json()),fetch('/api/docs').then(r=>r.json())]);
    decisions={};Object.entries(d.decisions).forEach(([k,v])=>decisions[k]=v.status);
    const dd0=await fetch('/api/messages?after=999999999').then(r=>r.json());
    if(b.usage)pres(dd0.presence,dd0.away,b.usage);
    const sig=JSON.stringify([b.last_id,b.open,b.away,b.usage,d.decisions,docs.docs,dd0.deferred]);
    if(sig===sideSig){applyDecisions();return}sideSig=sig;
    const ub=$('useBox');ub.textContent='';
    ['claude','codex'].forEach(k=>{const u=(b.usage||{})[k];const ago=u?Math.max(0,Math.round((Date.now()/1000-u.ts)/60)):0;
      ub.appendChild(el('div','item plain',NAMES[k]+': '+(u?u.pct+' % restante'+(u.resets?' · reinicia '+u.resets:'')+(u.week_pct!=null?' · semana '+u.week_pct+' %':'')+(u.by==='auto'?' · automático':' · hace '+(ago>=60?Math.round(ago/60)+' h':ago+' min'))+(u.note&&u.by!=='auto'?' · '+u.note:''):'sin dato')));});
    const aw=$('awayBox');aw.textContent='';
    const keys=Object.keys(b.away||{});
    if(!keys.length)aw.appendChild(el('div','none','Todos disponibles.'));
    keys.forEach(k=>{const a=b.away[k];aw.appendChild(el('div','item plain',NAMES[k]+' no disponible'+(a.until?' hasta '+a.until:'')+(a.note?' · '+a.note:'')));});
    const o=$('open');o.textContent='';if(!b.open.length)o.appendChild(el('div','none','Nada abierto.'));
    b.open.forEach(x=>item(o,x.id,'#'+x.id+' '+(TYPES[x.type]||x.type)+' de '+NAMES[x.from],x.head));
    const dc=$('decs');dc.textContent='';const ents=Object.entries(d.decisions);
    if(!ents.length)dc.appendChild(el('div','none','Ninguna todavía.'));
    ents.slice(-8).reverse().forEach(([k,v])=>{const m=byId[k];item(dc,Number(k),'#'+k+' · '+(DEC[v.status]||v.status),m?m.text.replace(/\s+/g,' ').slice(0,80):'');});
    const df=$('defer');df.textContent='';let any=false;
    const dd=await fetch('/api/messages?after=999999999').then(r=>r.json());
    Object.entries(dd.deferred||{}).forEach(([w,ids])=>ids.forEach(i=>{any=true;const m=byId[i];item(df,i,NAMES[w]+' · #'+i,m?m.text.replace(/\s+/g,' ').slice(0,80):'');}));
    if(!any)df.appendChild(el('div','none','Ninguno.'));
    const dx=$('docs');dx.textContent='';const names=Object.keys(docs.docs);
    if(!names.length)dx.appendChild(el('div','none','Sin documentos en el servidor.'));
    names.forEach(n=>{const x=docs.docs[n];const p=el('div');p.appendChild(el('b',null,n));p.appendChild(el('span',null,' v'+x.version+' · '+Object.keys(x.sections).length+' secciones'));dx.appendChild(p);});
    const st=$('stats');st.textContent='';
    [[b.last_id,'mensajes',false],[b.open.length,'abiertas',b.open.length>0],[Object.keys(d.decisions).length,'decisiones',false],[Object.values(dd.deferred||{}).reduce((a,x)=>a+x.length,0),'pendientes',false]].forEach(([n,l,hot])=>{const c=el('div','stat'+(hot?' hot':''));c.appendChild(el('div','n',String(n)));c.appendChild(el('div','l',l));st.appendChild(c)});
    const nb=b.open.length+keys.length;['badge','badge2'].forEach(id=>{const bd=$(id);bd.textContent=nb;bd.classList.toggle('on',nb>0)});
    applyDecisions();
  }catch(e){}}
function applyDecisions(){ /* etiqueta decisiones en los mensajes ya pintados, sin tocar el resto */
  Object.entries(decisions).forEach(([id,st])=>{const n=document.getElementById('m'+id);if(!n)return;
    const h=n.querySelector('.h');if(!h)return;let d=h.querySelector('.dec');
    if(!d){d=el('span','dec');const t=h.querySelector('.t');h.insertBefore(d,t)}
    d.className='dec '+st;d.textContent=DEC[st]||st;});}
async function poll(){
  try{
    const r=await fetch('/api/messages?after='+last+'&wait=20&_='+Date.now(),{signal:AbortSignal.timeout(30000),cache:'no-store'});
    const d=await r.json();fails=0;$('conn').textContent='en vivo';
    const nu=d.messages.length;d.messages.forEach(addMsg);
    pres(d.presence,d.away,d.usage);if(nu)side();
    setTimeout(poll,nu?0:300);
  }catch(e){fails++;$('conn').textContent='sin conexión, reintento '+fails;setTimeout(poll,Math.min(1000*fails,8000));}}
async function send(){
  const t=$('t').value.trim();if(!t)return;$('t').value='';$('t').style.height='auto';
  try{const r=await fetch('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from:'user',to:$('to').value,type:$('type').value,text:t})});
    if(!r.ok)throw 0;$('type').value='msg';}
  catch(e){$('t').value=t;$('conn').textContent='no se pudo enviar';}}
async function setAway(who,clear){
  let body={from:'user',who};
  if(clear){for(const w of ['claude','codex'])await fetch('/api/away',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from:'user',who:w,clear:true})});side();return;}
  body.until=($('awayUntil').value||'').trim();body.note='sin uso';
  await fetch('/api/away',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});side();}
$('f').onsubmit=e=>{e.preventDefault();send()};
$('t').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
$('t').oninput=e=>{e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px'};
$('q').oninput=e=>{query=e.target.value.trim().toLowerCase();renderAll()};
$('log').onscroll=()=>{const l=$('log');stick=l.scrollHeight-l.scrollTop-l.clientHeight<80;$('jump').style.display=stick?'none':'block'};
$('jump').onclick=()=>{stick=true;$('log').scrollTop=$('log').scrollHeight;$('jump').style.display='none'};
$('useSave').onclick=async()=>{for(const [w,id] of [['claude','useClaude'],['codex','useCodex']]){const v=$(id).value.trim().replace('%','').replace(',','.');if(!v)continue;const n=Number(v);if(!isFinite(n)||n<0||n>100){$(id).style.borderColor='var(--down)';continue}$(id).style.borderColor='';
  await fetch('/api/usage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from:'user',who:w,pct:n,resets:($('useUntil').value||'').trim()})});$(id).value=''}
  const d=await fetch('/api/messages?after=999999999').then(r=>r.json());pres(d.presence,d.away,d.usage);side()};
$('awayCodex').onclick=()=>setAway('codex');$('awayClaude').onclick=()=>setAway('claude');$('awayClear').onclick=()=>setAway(null,true);
function setPanel(open){document.body.classList.toggle('closed',!open);$('panelBtn').setAttribute('aria-expanded',String(open));
  try{localStorage.setItem('panel',open?'1':'0')}catch(e){}}
(function(){let v=null;try{v=localStorage.getItem('panel')}catch(e){}
  setPanel(v===null?matchMedia('(min-width:981px)').matches:v==='1');})();
$('panelBtn').onclick=()=>setPanel(document.body.classList.contains('closed'));
$('panelClose').onclick=()=>setPanel(false);
$('edgeTab').onclick=()=>setPanel(true);
document.addEventListener('keydown',e=>{if(e.key==='/'&&!/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||'')){e.preventDefault();$('q').focus();return}
  if((e.key==='p'||e.key==='P')&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&!/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||'')){setPanel(document.body.classList.contains('closed'))}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.body.classList.contains('closed')&&matchMedia('(max-width:980px)').matches)setPanel(false)});
chips();
// carga inicial: ultimos 150 mensajes y luego en vivo
fetch('/api/messages?after=0&limit=150&tail=1').then(r=>r.json()).then(d=>{d.messages.forEach(m=>{all.push(m);byId[m.id]=m;last=Math.max(last,m.id)});$('conn').textContent='en vivo';pres(d.presence,d.away,d.usage);side().then(renderAll);poll();}).catch(poll);
setInterval(side,20000);
</script>
</body>
